[project]
name = "tarsier-perception"
version = "0.1.0"
description = "MediaPipe perception worker for Tarsier"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe==1.0.1",
]

[project.scripts]
tarsier-perception = "tarsier_perception.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.13,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tarsier_perception"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
