[package]
name = "tarsier"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Local-first control and perception daemon for motorized cameras"
default-run = "tarsier"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = { version = "0.8.9", features = ["json", "ws"] }
base64 = "0.23"
bytes = "1.11"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
gstreamer = "0.25.3"
gstreamer-app = "0.25.2"
nix = { version = "0.31", features = ["fs", "ioctl"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.2", features = ["server", "transport-io", "schemars"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
rmcp = { version = "3.2", features = ["client"] }
tower = { version = "0.5", features = ["util"] }
