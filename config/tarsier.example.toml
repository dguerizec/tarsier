[server]
bind = "127.0.0.1:8742"

[video]
source = "camera"
input_device = "/dev/v4l/by-id/usb-Remo_Tech_Co.__Ltd._OBSBOT_Tiny_2-video-index0"
output_device = "/dev/video42"
width = 1280
height = 720
fps = 30
preview_width = 640
preview_height = 360
preview_quality = 75
loopback_enabled = true
output_mode = "camera"
background_enabled = true
background_effect = "green-screen"
restart_delay_ms = 1000

[camera]
adapter = "obsbot-tiny-2"
control_device = "/dev/v4l/by-id/usb-Remo_Tech_Co.__Ltd._OBSBOT_Tiny_2-video-index0"
xu_unit = 2
# Poll libdev's AI gimbal state and selector-6 zoom/tracking status at low
# priority. Built-in gesture readback runs at one fifth of this rate.
poll_interval_ms = 1000
minimum_command_interval_ms = 20
max_yaw_degrees = 130.0
max_pitch_degrees = 90.0

[perception]
enabled = true
supervise_worker = true
worker_project = "worker"
restart_delay_ms = 1000
source = "preview"
device = "/dev/video42"
width = 640
height = 360
fps = 10
mask_fps = 30
minimum_confidence = 0.60
detection_confidence = 0.5
dwell_ms = 800
release_confidence = 0.40
cooldown_ms = 3000
face_dwell_ms = 300
face_release_ms = 500

[avatar]
enabled = true
engine = "stylized-3d"
profile = "assets/avatars/stylized-3d.json"
# Optional versioned runtime export for the Personal 3D identity.
portrait_model = "assets/avatars/portrait/current"
# Kept ready for the optional LivePortrait fallback.
source_image = "assets/avatars/liveportrait-source.png"
fps = 30
compile = false

[depth]
enabled = true
fps = 30
# Depth Anything V2 uses 14-pixel patches. At the 16:9 perception aspect
# ratio, 252 produces a 448x252 tensor and leaves real-time headroom.
input_height = 252

[[scenarios]]
id = "open-palm-demo"
enabled = true
event = "gesture.open_palm.held"
action = "demo.open_palm"
