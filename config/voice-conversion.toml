# Development profile for physical device selection while main is stopped.
[server]
bind = "127.0.0.1:8743"

[audio]
reserve_inputs = false
virtual_source = "tarsier_voice_conversion"
virtual_output_enabled = true
set_default_source = false

[video]
source = "test"
input_device = "/dev/null"
output_device = "/dev/null"
loopback_enabled = false
width = 1280
height = 720
fps = 30

[camera]
adapter = "mock"
control_device = "/dev/null"

[perception]
enabled = true
supervise_worker = true
worker_project = "worker"
source = "preview"
device = "/dev/null"

[avatar]
enabled = true
profile = "assets/avatars/stylized-3d.json"
portrait_model = ".voice-conversion/assets/portrait"
source_image = ".voice-conversion/assets/liveportrait-source.png"
fps = 30
compile = false

[depth]
enabled = true
fps = 30
input_height = 252
